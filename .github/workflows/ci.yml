name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.12.15
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check src tests tools
      - run: uv run --no-sync python tools/check_types.py
        env:
          TYPECHECK_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -q

  storage:
    name: PostgreSQL storage contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-postgres
          POSTGRES_DB: hub_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hub_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.12.15
          python-version: '3.14'
          enable-cache: true
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - run: uv sync --locked
      - name: Exercise schema, isolation, atomic mutations and retention
        run: uv run --no-sync pytest -q tests/test_postgres_storage.py
        env:
          HUB_TEST_POSTGRES_DSN: postgresql://postgres:test-only-postgres@localhost:5432/hub_test_ci

      - name: Exercise GeoGuess scoring and replay protection
        run: uv run --no-sync pytest -q tests/test_geoguess_redis.py
        env:
          HUB_TEST_REDIS_URL: redis://127.0.0.1:6379/0

  security:
    name: Secrets and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/install_ci_tools.py "$RUNNER_TEMP/tools"
      - run: python3 tools/check_secrets.py
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/tools/gitleaks
      - run: '"$RUNNER_TEMP/tools/actionlint" -color'

  image:
    name: Linux image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check native libraries, startup, and image archive
        id: image
        run: python3 tools/deployment/build_release.py
      - name: Remove private image archive
        if: always()
        env:
          DEPLOY_ARCHIVE: ${{ steps.image.outputs.archive }}
        run: |
          if [ -n "$DEPLOY_ARCHIVE" ]; then
            rm -f -- "$DEPLOY_ARCHIVE" "$(dirname -- "$DEPLOY_ARCHIVE")/metadata.json"
          fi
