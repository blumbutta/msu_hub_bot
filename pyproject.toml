[project]
name = "msu-hub-bot"
version = "0.1.0"
description = "The revived MSU Hub Telegram bot"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-only"
dependencies = [
    "aiocache==0.12.3",
    "aiodns==4.0.4",
    "aiogram[proxy,redis]==3.31.0",
    "aiohttp==3.14.3",
    "aiohttp-socks==0.12.0",
    "airtable-python-wrapper==0.15.3",
    "arxiv==4.0.1",
    "beautifulsoup4==4.15.0",
    "Brotli==1.2.0",
    "cachetools==7.2.0",
    "ccxt==4.5.78",
    "dnspython==2.8.0",
    "emoji==2.16.0",
    "fonttools==4.65.0",
    "gtts==2.5.4",
    "jinja2==3.1.6",
    "lottie==0.7.2",
    "mcstatus==14.2.0",
    "pendulum==3.2.0",
    "pillow==12.3.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyfiglet==1.0.4",
    "pytesseract==0.3.13",
    "pytz==2026.3.post1",
    "redis==7.4.1",
    "requests==2.34.2",
    "tabulate==0.10.0",
    "throttler==1.2.3",
    "transliterate==1.10.2",
    "ujson==6.0.0",
    "yt-dlp[default,deno]==2026.8.19",
    "pyacrcloud==1.0.12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "babel==2.18.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-common==1.44.0",
]

[project.scripts]
msu-hub-bot = "msu_hub_bot.cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msu_hub_bot"]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-socket==0.8.1",
    "msgpack==1.2.2",
    "mypy==2.3.1",
    "types-requests==2.33.0.20260906",
    "types-cachetools==7.0.0.20260713",
    "types-tabulate==0.10.0.20260508",
]

[tool.ruff]
target-version = "py314"
line-length = 140
extend-exclude = ["src/msu_hub_bot/providers/_api2ch"]
# Standalone deployment tools also run on system Python outside the bot image.
per-file-target-version = { "tools/**/*.py" = "py311", "tools/deployment/host.py" = "py310" }

[tool.mypy]
python_version = "3.14"
strict = true
show_error_codes = true
warn_unused_configs = true
warn_unused_ignores = true
files = [
    "src/msu_hub_bot/execution/__init__.py",
    "src/msu_hub_bot/caching.py",
    "src/msu_hub_bot/storage/base.py",
    "src/msu_hub_bot/storage/factory.py",
    "src/msu_hub_bot/storage/models.py",
    "src/msu_hub_bot/storage/observations.py",
    "src/msu_hub_bot/storage/supabase.py",
