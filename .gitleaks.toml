title = "MSU Hub Bot credential rules"

[extend]
useDefault = true

[[rules]]
id = "literal-provider-token"
description = "Literal token passed to an analytics or speech client, including commented examples"
regex = '''(?:CountlyMiddleware|_?Wit)\(\s*['"]([A-Za-z0-9_-]{24,})['"]'''
secretGroup = 1

[[rules]]
id = "literal-provider-password"
description = "Literal password passed to the grammar client"
regex = '''Orfogrammka\(\s*['"][^'"\r\n]+['"]\s*,\s*['"]([^'"\r\n]+)['"]'''
secretGroup = 1

[[rules]]
id = "generic-api-key"
    [[rules.allowlists]]
    description = "Published api2ch source checksum, verified by the isolation test"
    condition = "AND"
    paths = ['''(?:^|/)tests/fixtures/api2ch_source\.json$''']
    regexTarget = "secret"
    regexes = ['''^c39b0cfe0d611420cad06c6ff3650864075e56fe74a52a837c5248985d66cb11$''']

    [[rules.allowlists]]
    description = "Synthetic chess game identifier used only in board and view tests, never an authentication token"
    condition = "AND"
    paths = ['''(?:^|/)tests/test_chess_play_(?:board|view)\.py$''']
    regexTarget = "secret"
    regexes = ['''^012345abcdef$''']
